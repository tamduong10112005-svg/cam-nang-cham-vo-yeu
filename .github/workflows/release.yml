name: Build and publish Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing or new release tag, for example v1.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          app_version="$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)"
          tag_version="${RELEASE_TAG#v}"
          if [[ -z "$app_version" || "$app_version" != "$tag_version" ]]; then
            echo "Tag $RELEASE_TAG must match pubspec version $app_version"
            exit 1
          fi

      - name: Configure private signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build signed APK
        run: flutter build apk --release --dart-define=UPDATE_REPOSITORY=${{ github.repository }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk cam-nang-cham-vo-yeu.apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" cam-nang-cham-vo-yeu.apk --clobber
          else
            gh release create "$RELEASE_TAG" cam-nang-cham-vo-yeu.apk \
              --title "Cẩm nang chăm vợ yêu $RELEASE_TAG" \
              --generate-notes
          fi

